# 束流事件流复核台：React 前端 + FastAPI 裁决 API + 一次性 verify 服务。
# 宿主机端口与健康检查参数均可通过环境变量 / .env 覆盖（见 .env.example）。

services:
  api:
    build:
      context: ./backend
    image: beam-recheck-api:latest
    environment:
      APP_PORT: ${API_INTERNAL_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_HOST_PORT:-8000}:${API_INTERNAL_PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('APP_PORT','8000'), timeout=2).status == 200 else 1)"
      interval: ${HEALTH_INTERVAL:-10s}
      timeout: ${HEALTH_TIMEOUT:-3s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${HEALTH_START_PERIOD:-5s}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: beam-recheck-frontend:latest
    environment:
      LISTEN_PORT: ${FRONTEND_INTERNAL_PORT:-80}
      API_UPSTREAM: api:${API_INTERNAL_PORT:-8000}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:${FRONTEND_INTERNAL_PORT:-80}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:${FRONTEND_INTERNAL_PORT:-80}/ >/dev/null 2>&1 || exit 1"
      interval: ${HEALTH_INTERVAL:-10s}
      timeout: ${HEALTH_TIMEOUT:-3s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${HEALTH_START_PERIOD:-5s}
    restart: unless-stopped

  # 一次性复核服务：pytest 代码测试 → 前端构建检查 → HTTP 冒烟，
  # 自行退出并以退出码报告结果（0 全部通过）。
  # 运行：docker compose run --rm verify   （或 docker compose up --abort-on-container-exit verify）
  verify:
    build:
      context: .
      dockerfile: docker/verify/Dockerfile
    image: beam-recheck-verify:latest
    environment:
      API_BASE: http://api:${API_INTERNAL_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
